name: build

on:
  push:
    branches: [tsbot]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bot
        run: dotnet publish TS3AudioBot/TS3AudioBot.csproj -c Release -r win-x64 --self-contained -o out/TSBot/bot

      - name: Web panel
        shell: bash
        working-directory: WebInterface
        run: |
          npm install -g yarn
          yarn install --frozen-lockfile
          yarn run build
          cp -r dist ../out/TSBot/bot/WebInterface

      - name: Package
        shell: bash
        run: |
          cp -r tsbot/scripts tsbot/config out/TSBot/
          cp install.ps1 README.md tsbot/Setup.cmd out/TSBot/
          cd out && 7z a -tzip ../TSBot-win-x64.zip TSBot

      - uses: actions/upload-artifact@v4
        with:
          name: TSBot-win-x64
          path: TSBot-win-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" TSBot-win-x64.zip --title "TSBot $GITHUB_REF_NAME" --notes "Windows x64. Установка — см. README."
